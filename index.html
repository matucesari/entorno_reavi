<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditorio Virtual UTN - P2P</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a10; font-family: monospace; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(10, 15, 25, 0.9); color: #00ffcc;
      padding: 12px 18px; border-radius: 6px; border: 1px solid #00ffcc55;
    }
    input, button {
      background: #181d26; color: #fff; border: 1px solid #00ffcc66;
      padding: 6px 10px; margin-top: 6px; border-radius: 4px;
    }
    button { cursor: pointer; background: #00ffcc22; font-weight: bold; }
    button:hover { background: #00ffcc44; }
    #stats { font-size: 11px; color: #8899aa; margin-top: 6px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="hud">
    <div style="font-weight: bold; font-size: 14px;">Auditorio Virtual UTN</div>
    <div id="connectionPanel">
      <input type="text" id="username" placeholder="Nombre" value="Docente"><br>
      <input type="text" id="roomId" placeholder="ID Sala" value="auditorio-1"><br>
      <button id="btnJoin">Ingresar al Auditorio</button>
    </div>
    <div id="stats">W, A, S, D para caminar | Q, E para rotar vista</div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN FIREBASE (Tus credenciales)
    // ==========================================
	const firebaseConfig = {
	  apiKey: "AIzaSyBgYPJWcmfimhT0FSLp92A4ocFDNOrhTY0",
	  authDomain: "reavi-94216.firebaseapp.com",
	  databaseURL: "https://reavi-94216-default-rtdb.firebaseio.com",
	  projectId: "reavi-94216",
	  storageBucket: "reavi-94216.firebasestorage.app",
	  messagingSenderId: "369904212083",
	  appId: "1:369904212083:web:8dae7ac8a5c6041ee9b206",
	  measurementId: "G-Q48KH7JHL8"
	};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 2. ESCENA Y MOTOR THREE.JS
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1118);
    scene.fog = new THREE.FogExp2(0x0e1118, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Iluminación de Auditorio
    const ambientLight = new THREE.AmbientLight(0xddeeff, 0.4);
    scene.add(ambientLight);

    // Foco principal en el estrado / pizarra
    const stageSpot = new THREE.SpotLight(0xffffff, 1.2, 50, Math.PI / 4, 0.3);
    stageSpot.position.set(0, 14, -12);
    stageSpot.target.position.set(0, 2, -22);
    stageSpot.castShadow = true;
    scene.add(stageSpot);
    scene.add(stageSpot.target);

    // Luces generales de techo
    const downLight = new THREE.PointLight(0xfff5ea, 0.6, 60);
    downLight.position.set(0, 12, 5);
    scene.add(downLight);

    // ==========================================
    // 3. CONSTRUCCIÓN PROCEDURAL DEL AUDITORIO
    // ==========================================
    const matFloor = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.7 });
    const matWall = new THREE.MeshStandardMaterial({ color: 0x242a36, roughness: 0.9 });
    const matWood = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.5 });
    const matScreen = new THREE.MeshBasicMaterial({ color: 0x051525 });
    const matDesk = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.6 });

    // Suelo base (40m ancho x 60m largo)
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), matFloor);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Pared frontal (fondo del estrado)
    const frontWall = new THREE.Mesh(new THREE.BoxGeometry(40, 14, 1), matWall);
    frontWall.position.set(0, 7, -30);
    frontWall.receiveShadow = true;
    scene.add(frontWall);

    // Pantalla de proyección central
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), matScreen);
    screen.position.set(0, 7.5, -29.4);
    scene.add(screen);

    // Marco de pantalla
    const frame = new THREE.Mesh(new THREE.BoxGeometry(18.4, 9.4, 0.2), matDesk);
    frame.position.set(0, 7.5, -29.5);
    scene.add(frame);

    // Estrado / Tarima del Docente
    const stage = new THREE.Mesh(new THREE.BoxGeometry(24, 0.8, 10), matWood);
    stage.position.set(0, 0.4, -22);
    stage.receiveShadow = true;
    stage.castShadow = true;
    scene.add(stage);

    // Púlpito / Mesa de disertación
    const podium = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 1.2), matDesk);
    podium.position.set(0, 1.4, -20);
    podium.castShadow = true;
    scene.add(podium);

    // Gradas y filas de pupitres para alumnos
    for (let r = 0; r < 6; r++) {
      const zPos = -10 + (r * 5);
      const yStep = r * 0.4;

      // Escalón del suelo
      const riser = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4 + yStep, 4.5), matFloor);
      riser.position.set(0, (0.4 + yStep) / 2, zPos);
      riser.receiveShadow = true;
      scene.add(riser);

      // Pupitre largo izquierdo y derecho (con pasillo al medio)
      [-8, 8].forEach(xOffset => {
        const desk = new THREE.Mesh(new THREE.BoxGeometry(10, 0.8, 1), matWood);
        desk.position.set(xOffset, 0.8 + yStep, zPos);
        desk.castShadow = true;
        scene.add(desk);

        // Patas del pupitre
        [-4.5, 4.5].forEach(legX => {
          const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8 + yStep, 0.8), matDesk);
          leg.position.set(xOffset + legX, (0.8 + yStep) / 2, zPos);
          scene.add(leg);
        });
      });
    }

    // ==========================================
    // 4. MODELADO DE AVATARES HUMANOIDES
    // ==========================================
    function createHumanoidAvatar(accentHex) {
      const root = new THREE.Group();

      const suitMat = new THREE.MeshStandardMaterial({ color: 0x222630, roughness: 0.6 });
      const accentMat = new THREE.MeshStandardMaterial({ color: accentHex, roughness: 0.4 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd9a584, roughness: 0.8 });
      const visorMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.1 });

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.35), accentMat);
      torso.position.y = 1.2;
      torso.castShadow = true;
      root.add(torso);

      // Cabeza
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.38, 0.35), skinMat);
      head.position.y = 1.8;
      head.castShadow = true;
      root.add(head);

      // Visor frontal (HUD de orientación en el rostro)
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.05), visorMat);
      visor.position.set(0, 1.82, -0.19);
      root.add(visor);

      // Extremidades articulables para animación de marcha
      const limbGeo = new THREE.BoxGeometry(0.18, 0.7, 0.18);

      const leftArm = new THREE.Mesh(limbGeo, suitMat);
      leftArm.position.set(-0.42, 1.15, 0);
      root.add(leftArm);

      const rightArm = new THREE.Mesh(limbGeo, suitMat);
      rightArm.position.set(0.42, 1.15, 0);
      root.add(rightArm);

      const leftLeg = new THREE.Mesh(limbGeo, suitMat);
      leftLeg.position.set(-0.18, 0.45, 0);
      leftLeg.castShadow = true;
      root.add(leftLeg);

      const rightLeg = new THREE.Mesh(limbGeo, suitMat);
      rightLeg.position.set(0.18, 0.45, 0);
      rightLeg.castShadow = true;
      root.add(rightLeg);

      // Referencias directas para animar rotaciones
      return {
        root,
        leftArm,
        rightArm,
        leftLeg,
        rightLeg
      };
    }

    const localAvatar = createHumanoidAvatar(0x0099ff);
    localAvatar.root.position.set(0, 0, 5); // Inicia en el auditorio mirando al frente
    scene.add(localAvatar.root);

    const remotePeers = {}; // { peerId: { avatar, targetPos, targetRotY, conn, isMoving } }

    // ==========================================
    // 5. ENTRADA Y FÍSICA BÁSICA LOCAL
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    let localAngle = 0;
    let walkCycle = 0;
    const moveSpeed = 0.15;
    const rotSpeed = 0.04;

    function handleLocalInput() {
      let moved = false;

      if (keys['q']) { localAngle += rotSpeed; }
      if (keys['e']) { localAngle -= rotSpeed; }
      localAvatar.root.rotation.y = localAngle;

      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

      if (keys['w']) { localAvatar.root.position.addScaledVector(fwd, moveSpeed); moved = true; }
      if (keys['s']) { localAvatar.root.position.addScaledVector(fwd, -moveSpeed); moved = true; }
      if (keys['a']) { localAvatar.root.position.addScaledVector(rgt, -moveSpeed); moved = true; }
      if (keys['d']) { localAvatar.root.position.addScaledVector(rgt, moveSpeed); moved = true; }

      // Límites del aula
      localAvatar.root.position.x = Math.max(-18, Math.min(18, localAvatar.root.position.x));
      localAvatar.root.position.z = Math.max(-28, Math.min(25, localAvatar.root.position.z));

      // Animación de marcha local
      if (moved) {
        walkCycle += 0.2;
        localAvatar.leftLeg.rotation.x = Math.sin(walkCycle) * 0.6;
        localAvatar.rightLeg.rotation.x = -Math.sin(walkCycle) * 0.6;
        localAvatar.leftArm.rotation.x = -Math.sin(walkCycle) * 0.6;
        localAvatar.rightArm.rotation.x = Math.sin(walkCycle) * 0.6;
      } else {
        localAvatar.leftLeg.rotation.x = 0;
        localAvatar.rightLeg.rotation.x = 0;
        localAvatar.leftArm.rotation.x = 0;
        localAvatar.rightArm.rotation.x = 0;
      }

      // Cámara en tercera persona
      const camOffset = new THREE.Vector3(0, 2.6, 5.0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      camera.position.copy(localAvatar.root.position).add(camOffset);
      camera.lookAt(
        localAvatar.root.position.x,
        localAvatar.root.position.y + 1.4,
        localAvatar.root.position.z
      );

      return moved;
    }

    // ==========================================
    // 6. RED: PEERJS + FIREBASE
    // ==========================================
    let peer = null;

    document.getElementById('btnJoin').addEventListener('click', () => {
      const roomName = document.getElementById('roomId').value.trim();
      const userName = document.getElementById('username').value.trim();
      if (!roomName || !userName) return;

      document.getElementById('connectionPanel').style.display = 'none';
      document.getElementById('stats').innerText = `Conectando...`;

      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('stats').innerText = `Auditorio: ${roomName} | Usuario: ${userName}`;

        peer.on('connection', (conn) => setupDataChannel(conn));

        const roomRef = db.ref(`rooms/${roomName}/peers`);
        const myPresence = db.ref(`rooms/${roomName}/peers/${id}`);

        myPresence.set({ user: userName, joined: firebase.database.ServerValue.TIMESTAMP });
        myPresence.onDisconnect().remove();

        roomRef.once('value', (snap) => {
          const list = snap.val() || {};
          Object.keys(list).forEach((remoteId) => {
            if (remoteId !== id && !remotePeers[remoteId]) {
              setupDataChannel(peer.connect(remoteId));
            }
          });
        });

        roomRef.on('child_removed', (snap) => removeRemotePeer(snap.key));
      });
    });

    function setupDataChannel(conn) {
      conn.on('open', () => {
        if (!remotePeers[conn.peer]) {
          const avatar = createHumanoidAvatar(0xff5533);
          scene.add(avatar.root);

          remotePeers[conn.peer] = {
            conn: conn,
            avatar: avatar,
            targetPos: new THREE.Vector3(0, 0, 5),
            targetRotY: 0,
            walkCycle: 0
          };
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'sync' && remotePeers[conn.peer]) {
          const p = remotePeers[conn.peer];
          p.targetPos.set(data.x, data.y, data.z);
          p.targetRotY = data.ry;
          p.isMoving = data.moving;
        }
      });

      conn.on('close', () => removeRemotePeer(conn.peer));
      conn.on('error', () => removeRemotePeer(conn.peer));
    }

    function removeRemotePeer(id) {
      if (remotePeers[id]) {
        scene.remove(remotePeers[id].avatar.root);
        if (remotePeers[id].conn) remotePeers[id].conn.close();
        delete remotePeers[id];
      }
    }

    // Emisión regulada a 20 Hz
    setInterval(() => {
      if (!peer || peer.disconnected) return;

      const moving = keys['w'] || keys['s'] || keys['a'] || keys['d'];
      const payload = {
        type: 'sync',
        x: Number(localAvatar.root.position.x.toFixed(3)),
        y: Number(localAvatar.root.position.y.toFixed(3)),
        z: Number(localAvatar.root.position.z.toFixed(3)),
        ry: Number(localAvatar.root.rotation.y.toFixed(3)),
        moving: moving
      };

      for (const id in remotePeers) {
        if (remotePeers[id].conn && remotePeers[id].conn.open) {
          remotePeers[id].conn.send(payload);
        }
      }
    }, 50);

    // ==========================================
    // 7. BUCLE DE RENDER E INTERPOLACIÓN
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      handleLocalInput();

      // Interpolar y animar pares remotos
      for (const id in remotePeers) {
        const p = remotePeers[id];
        p.avatar.root.position.lerp(p.targetPos, 0.15);

        let diff = p.targetRotY - p.avatar.root.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        p.avatar.root.rotation.y += diff * 0.15;

        // Marcha del par remoto
        if (p.isMoving) {
          p.walkCycle += 0.2;
          p.avatar.leftLeg.rotation.x = Math.sin(p.walkCycle) * 0.6;
          p.avatar.rightLeg.rotation.x = -Math.sin(p.walkCycle) * 0.6;
          p.avatar.leftArm.rotation.x = -Math.sin(p.walkCycle) * 0.6;
          p.avatar.rightArm.rotation.x = Math.sin(p.walkCycle) * 0.6;
        } else {
          p.avatar.leftLeg.rotation.x = 0;
          p.avatar.rightLeg.rotation.x = 0;
          p.avatar.leftArm.rotation.x = 0;
          p.avatar.rightArm.rotation.x = 0;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
