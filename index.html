<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditorio Virtual UTN - P2P</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a10; font-family: monospace; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(10, 15, 25, 0.9); color: #00ffcc;
      padding: 12px 18px; border-radius: 6px; border: 1px solid #00ffcc55;
    }
    input, button {
      background: #181d26; color: #fff; border: 1px solid #00ffcc66;
      padding: 6px 10px; margin-top: 6px; border-radius: 4px;
    }
    button { cursor: pointer; background: #00ffcc22; font-weight: bold; }
    button:hover { background: #00ffcc44; }
    #stats { font-size: 11px; color: #8899aa; margin-top: 6px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="hud">
    <div style="font-weight: bold; font-size: 14px;">Auditorio Virtual UTN</div>
    <div id="connectionPanel">
      <input type="text" id="username" placeholder="Nombre" value="Docente"><br>
      <input type="text" id="roomId" placeholder="ID Sala" value="auditorio-1"><br>
      <button id="btnJoin">Ingresar al Auditorio</button>
    </div>
    <div id="stats">W, A, S, D: caminar | Q, E: rotar vista</div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN FIREBASE
    // ==========================================
   	const firebaseConfig = {
	  apiKey: "AIzaSyBgYPJWcmfimhT0FSLp92A4ocFDNOrhTY0",
	  authDomain: "reavi-94216.firebaseapp.com",
	  databaseURL: "https://reavi-94216-default-rtdb.firebaseio.com",
	  projectId: "reavi-94216",
	  storageBucket: "reavi-94216.firebasestorage.app",
	  messagingSenderId: "369904212083",
	  appId: "1:369904212083:web:8dae7ac8a5c6041ee9b206",
	  measurementId: "G-Q48KH7JHL8"
	};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 2. ESCENA Y MOTOR THREE.JS
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1118);
    scene.fog = new THREE.FogExp2(0x0e1118, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xddeeff, 0.5));

    const stageSpot = new THREE.SpotLight(0xffffff, 1.2, 50, Math.PI / 4, 0.3);
    stageSpot.position.set(0, 14, -12);
    stageSpot.target.position.set(0, 2, -22);
    stageSpot.castShadow = true;
    scene.add(stageSpot);
    scene.add(stageSpot.target);

    // ==========================================
    // 3. AUDITORIO
    // ==========================================
    const matFloor = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.7 });
    const matWall = new THREE.MeshStandardMaterial({ color: 0x242a36, roughness: 0.9 });
    const matWood = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.5 });
    const matDesk = new THREE.MeshStandardMaterial({ color: 0x2e3440, roughness: 0.6 });

    // Suelo
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), matFloor);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Pared frontal y pantalla
    const frontWall = new THREE.Mesh(new THREE.BoxGeometry(40, 14, 1), matWall);
    frontWall.position.set(0, 7, -30);
    scene.add(frontWall);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), new THREE.MeshBasicMaterial({ color: 0x051525 }));
    screen.position.set(0, 7.5, -29.4);
    scene.add(screen);

    // Estrado y mesa del docente
    const stage = new THREE.Mesh(new THREE.BoxGeometry(24, 0.8, 10), matWood);
    stage.position.set(0, 0.4, -22);
    stage.receiveShadow = true;
    scene.add(stage);

    const podium = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 1.2), matDesk);
    podium.position.set(0, 1.4, -20);
    scene.add(podium);

    // Gradas y pupitres
    for (let r = 0; r < 5; r++) {
      const zPos = -8 + (r * 5);
      const yStep = r * 0.4;

      const riser = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4 + yStep, 4.5), matFloor);
      riser.position.set(0, (0.4 + yStep) / 2, zPos);
      riser.receiveShadow = true;
      scene.add(riser);

      [-8, 8].forEach(xOffset => {
        const desk = new THREE.Mesh(new THREE.BoxGeometry(10, 0.8, 1), matWood);
        desk.position.set(xOffset, 0.8 + yStep, zPos);
        scene.add(desk);
      });
    }

    // ==========================================
    // 4. AVATARES
    // ==========================================
    function createHumanoidAvatar(accentHex) {
      const root = new THREE.Group();
      const suitMat = new THREE.MeshStandardMaterial({ color: 0x222630 });
      const accentMat = new THREE.MeshStandardMaterial({ color: accentHex });
      const limbGeo = new THREE.BoxGeometry(0.18, 0.7, 0.18);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.35), accentMat);
      torso.position.y = 1.2;
      root.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.38, 0.35), new THREE.MeshStandardMaterial({ color: 0xd9a584 }));
      head.position.y = 1.8;
      root.add(head);

      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.05), new THREE.MeshStandardMaterial({ color: 0x00ffcc }));
      visor.position.set(0, 1.82, -0.19);
      root.add(visor);

      const leftArm = new THREE.Mesh(limbGeo, suitMat);
      leftArm.position.set(-0.42, 1.15, 0);
      root.add(leftArm);

      const rightArm = new THREE.Mesh(limbGeo, suitMat);
      rightArm.position.set(0.42, 1.15, 0);
      root.add(rightArm);

      const leftLeg = new THREE.Mesh(limbGeo, suitMat);
      leftLeg.position.set(-0.18, 0.45, 0);
      root.add(leftLeg);

      const rightLeg = new THREE.Mesh(limbGeo, suitMat);
      rightLeg.position.set(0.18, 0.45, 0);
      root.add(rightLeg);

      return { root, leftArm, rightArm, leftLeg, rightLeg };
    }

    const localAvatar = createHumanoidAvatar(0x0099ff);
    localAvatar.root.position.set(0, 0, 5);
    scene.add(localAvatar.root);

    const remotePeers = {};

    // ==========================================
    // 5. MOVIMIENTO LOCAL
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    let localAngle = 0;
    let walkCycle = 0;

    function handleLocalInput() {
      let moved = false;
      if (keys['q']) localAngle += 0.04;
      if (keys['e']) localAngle -= 0.04;
      localAvatar.root.rotation.y = localAngle;

      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

      if (keys['w']) { localAvatar.root.position.addScaledVector(fwd, 0.15); moved = true; }
      if (keys['s']) { localAvatar.root.position.addScaledVector(fwd, -0.15); moved = true; }
      if (keys['a']) { localAvatar.root.position.addScaledVector(rgt, -0.15); moved = true; }
      if (keys['d']) { localAvatar.root.position.addScaledVector(rgt, 0.15); moved = true; }

      if (moved) {
        walkCycle += 0.2;
        localAvatar.leftLeg.rotation.x = Math.sin(walkCycle) * 0.6;
        localAvatar.rightLeg.rotation.x = -Math.sin(walkCycle) * 0.6;
        localAvatar.leftArm.rotation.x = -Math.sin(walkCycle) * 0.6;
        localAvatar.rightArm.rotation.x = Math.sin(walkCycle) * 0.6;
      } else {
        localAvatar.leftLeg.rotation.x = 0;
        localAvatar.rightLeg.rotation.x = 0;
        localAvatar.leftArm.rotation.x = 0;
        localAvatar.rightArm.rotation.x = 0;
      }

      const camOffset = new THREE.Vector3(0, 2.6, 5.0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      camera.position.copy(localAvatar.root.position).add(camOffset);
      camera.lookAt(localAvatar.root.position.x, localAvatar.root.position.y + 1.4, localAvatar.root.position.z);
    }

    // ==========================================
    // 6. RED: PEERJS + FIREBASE BIDIRECCIONAL
    // ==========================================
    let peer = null;
    let myId = null;

    document.getElementById('btnJoin').addEventListener('click', () => {
      const roomName = document.getElementById('roomId').value.trim();
      const userName = document.getElementById('username').value.trim();
      if (!roomName || !userName) return;

      document.getElementById('connectionPanel').style.display = 'none';
      document.getElementById('stats').innerText = "Iniciando PeerJS...";

      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('stats').innerText = `Auditorio: ${roomName} | Usuario: ${userName}`;

        // Escuchar conexiones entrantes
        peer.on('connection', (conn) => setupConnection(conn));

        const roomPeersRef = db.ref(`rooms/${roomName}/peers`);
        const myRef = db.ref(`rooms/${roomName}/peers/${myId}`);

        // 1. Escuchar a cualquier participante que entre después que yo
        roomPeersRef.on('child_added', (snap) => {
          const remoteId = snap.key;
          // Solo inicia la conexión el peer con ID léxicamente menor para evitar conexiones duplicadas
          if (remoteId !== myId && !remotePeers[remoteId]) {
            if (myId < remoteId) {
              const conn = peer.connect(remoteId);
              setupConnection(conn);
            }
          }
        });

        // 2. Registrarse en la sala
        myRef.set({ user: userName, t: Date.now() });
        myRef.onDisconnect().remove();

        // 3. Limpiar al desconectar
        roomPeersRef.on('child_removed', (snap) => {
          removeRemotePeer(snap.key);
        });
      });

      peer.on('error', (err) => {
        console.error("PeerJS error:", err);
      });
    });

    function setupConnection(conn) {
      conn.on('open', () => {
        if (!remotePeers[conn.peer]) {
          const avatar = createHumanoidAvatar(0xff5533);
          scene.add(avatar.root);

          remotePeers[conn.peer] = {
            conn: conn,
            avatar: avatar,
            targetPos: new THREE.Vector3(0, 0, 5),
            targetRotY: 0,
            walkCycle: 0,
            isMoving: false
          };
        } else {
          remotePeers[conn.peer].conn = conn;
        }
      });

      conn.on('data', (data) => {
        if (data.t === 's' && remotePeers[conn.peer]) {
          const p = remotePeers[conn.peer];
          p.targetPos.set(data.x, data.y, data.z);
          p.targetRotY = data.ry;
          p.isMoving = data.m;
        }
      });

      conn.on('close', () => removeRemotePeer(conn.peer));
      conn.on('error', () => removeRemotePeer(conn.peer));
    }

    function removeRemotePeer(id) {
      if (remotePeers[id]) {
        scene.remove(remotePeers[id].avatar.root);
        if (remotePeers[id].conn) remotePeers[id].conn.close();
        delete remotePeers[id];
      }
    }

    // Emisión periódica a 20 Hz
    setInterval(() => {
      if (!peer || !myId) return;

      const moving = keys['w'] || keys['s'] || keys['a'] || keys['d'];
      const payload = {
        t: 's',
        x: Number(localAvatar.root.position.x.toFixed(2)),
        y: Number(localAvatar.root.position.y.toFixed(2)),
        z: Number(localAvatar.root.position.z.toFixed(2)),
        ry: Number(localAvatar.root.rotation.y.toFixed(2)),
        m: moving
      };

      for (const id in remotePeers) {
        const p = remotePeers[id];
        if (p.conn && p.conn.open) {
          p.conn.send(payload);
        }
      }
    }, 50);

    // ==========================================
    // 7. RENDER & LERP
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      handleLocalInput();

      for (const id in remotePeers) {
        const p = remotePeers[id];
        p.avatar.root.position.lerp(p.targetPos, 0.15);

        let diff = p.targetRotY - p.avatar.root.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        p.avatar.root.rotation.y += diff * 0.15;

        if (p.isMoving) {
          p.walkCycle += 0.2;
          p.avatar.leftLeg.rotation.x = Math.sin(p.walkCycle) * 0.6;
          p.avatar.rightLeg.rotation.x = -Math.sin(p.walkCycle) * 0.6;
          p.avatar.leftArm.rotation.x = -Math.sin(p.walkCycle) * 0.6;
          p.avatar.rightArm.rotation.x = Math.sin(p.walkCycle) * 0.6;
        } else {
          p.avatar.leftLeg.rotation.x = 0;
          p.avatar.rightLeg.rotation.x = 0;
          p.avatar.leftArm.rotation.x = 0;
          p.avatar.rightArm.rotation.x = 0;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
