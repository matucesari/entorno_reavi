<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aula Virtual 3D - P2P Mesh</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: monospace; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 15, 20, 0.85); color: #00ffcc;
      padding: 12px 16px; border-radius: 6px; border: 1px solid #00ffcc44;
    }
    input, button {
      background: #222; color: #fff; border: 1px solid #555;
      padding: 6px 10px; margin-top: 6px; border-radius: 4px;
    }
    button { cursor: pointer; border-color: #00ffcc; font-weight: bold; }
    button:hover { background: #00ffcc22; }
    #stats { font-size: 11px; color: #aaa; margin-top: 6px; }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Firebase App & Realtime Database (SDK Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="hud">
    <div style="font-weight: bold; font-size: 14px;">Entorno Virtual P2P</div>
    <div id="connectionPanel">
      <input type="text" id="username" placeholder="Nombre de usuario" value="Alumno_1"><br>
      <input type="text" id="roomId" placeholder="ID Sala" value="aula-ia"><br>
      <button id="btnJoin">Ingresar a Sala</button>
    </div>
    <div id="stats">W, A, S, D para caminar | Q, E para rotar</div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN FIREBASE (Completar credenciales)
    // ==========================================
	
	const firebaseConfig = {
	  apiKey: "AIzaSyBgYPJWcmfimhT0FSLp92A4ocFDNOrhTY0",
	  authDomain: "reavi-94216.firebaseapp.com",
	  databaseURL: "https://reavi-94216-default-rtdb.firebaseio.com",
	  projectId: "reavi-94216",
	  storageBucket: "reavi-94216.firebasestorage.app",
	  messagingSenderId: "369904212083",
	  appId: "1:369904212083:web:8dae7ac8a5c6041ee9b206",
	  measurementId: "G-Q48KH7JHL8"
	};

	firebase.initializeApp(firebaseConfig);
    const db = firebase.database();	

    // ==========================================
    // 2. ENTORNO THREE.JS
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181820);
    scene.fog = new THREE.FogExp2(0x181820, 0.025);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Suelo cuadriculado
    const grid = new THREE.GridHelper(80, 80, 0x00ffcc, 0x333344);
    grid.position.y = 0.01;
    scene.add(grid);

    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x121218, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Fábrica de mallas de Avatar
    function createAvatarMesh(colorHex) {
      const group = new THREE.Group();
      
      // Cuerpo (Cápsula simplificada con cilindro + esfera superior)
      const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.4, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;
      body.castShadow = true;
      group.add(body);

      // Visor direccional (indica orientación hacia adelante: eje -Z)
      const visorGeo = new THREE.BoxGeometry(0.35, 0.2, 0.3);
      const visorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 1.3, -0.3);
      group.add(visor);

      return group;
    }

    const localColor = 0x00ccff;
    const localAvatar = createAvatarMesh(localColor);
    scene.add(localAvatar);

    // Estructuras para sincronización remota
    const remotePeers = {}; // { peerId: { mesh, targetPos, targetRot, conn } }

    // ==========================================
    // 3. CONTROL DE MOVIMIENTO LOCAL
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    let localAngle = 0;
    const moveSpeed = 0.12;
    const rotSpeed = 0.04;

    function handleLocalMovement() {
      let moved = false;

      // Rotación sobre eje Y
      if (keys['q']) { localAngle += rotSpeed; moved = true; }
      if (keys['e']) { localAngle -= rotSpeed; moved = true; }
      localAvatar.rotation.y = localAngle;

      // Vectores relativos a la orientación
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

      if (keys['w']) { localAvatar.position.addScaledVector(forward, moveSpeed); moved = true; }
      if (keys['s']) { localAvatar.position.addScaledVector(forward, -moveSpeed); moved = true; }
      if (keys['a']) { localAvatar.position.addScaledVector(right, -moveSpeed); moved = true; }
      if (keys['d']) { localAvatar.position.addScaledVector(right, moveSpeed); moved = true; }

      // Cámara en tercera persona (persiguiendo al avatar)
      const camOffset = new THREE.Vector3(0, 3.5, 6).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      camera.position.copy(localAvatar.position).add(camOffset);
      camera.lookAt(localAvatar.position.x, localAvatar.position.y + 1.0, localAvatar.position.z);

      return moved;
    }

    // ==========================================
    // 4. NETWORKING: PEERJS + FIREBASE
    // ==========================================
    let peer = null;
    let roomRef = null;
    let myPresenceRef = null;

    document.getElementById('btnJoin').addEventListener('click', () => {
      const roomName = document.getElementById('roomId').value.trim();
      const userName = document.getElementById('username').value.trim();
      if (!roomName || !userName) return;

      document.getElementById('connectionPanel').style.display = 'none';
      document.getElementById('stats').innerText = `Conectando como: ${userName}...`;

      peer = new Peer();

      peer.on('open', (myPeerId) => {
        document.getElementById('stats').innerText = `Sala: ${roomName} | ID: ${myPeerId}`;

        // 1. Escuchar conexiones entrantes
        peer.on('connection', (conn) => {
          setupDataChannel(conn);
        });

        // 2. Registrar presencia en Firebase Realtime DB
        roomRef = db.ref(`rooms/${roomName}/peers`);
        myPresenceRef = db.ref(`rooms/${roomName}/peers/${myPeerId}`);

        myPresenceRef.set({
          user: userName,
          joinedAt: firebase.database.ServerValue.TIMESTAMP
        });

        // Eliminación atómica del registro al desconectar
        myPresenceRef.onDisconnect().remove();

        // 3. Conectarse a pares ya presentes en la sala
        roomRef.once('value', (snapshot) => {
          const peers = snapshot.val() || {};
          Object.keys(peers).forEach((remoteId) => {
            if (remoteId !== myPeerId && !remotePeers[remoteId]) {
              const conn = peer.connect(remoteId);
              setupDataChannel(conn);
            }
          });
        });

        // 4. Escuchar cuando un par abandona
        roomRef.on('child_removed', (snapshot) => {
          const removedId = snapshot.key;
          removeRemotePeer(removedId);
        });
      });
    });

    function setupDataChannel(conn) {
      conn.on('open', () => {
        // Inicializar objeto remoto
        if (!remotePeers[conn.peer]) {
          const mesh = createAvatarMesh(0xff5533);
          scene.add(mesh);

          remotePeers[conn.peer] = {
            conn: conn,
            mesh: mesh,
            targetPos: new THREE.Vector3(0, 0, 0),
            targetRotY: 0
          };
        } else {
          remotePeers[conn.peer].conn = conn;
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'transform' && remotePeers[conn.peer]) {
          remotePeers[conn.peer].targetPos.set(data.x, data.y, data.z);
          remotePeers[conn.peer].targetRotY = data.ry;
        }
      });

      conn.on('close', () => removeRemotePeer(conn.peer));
      conn.on('error', () => removeRemotePeer(conn.peer));
    }

    function removeRemotePeer(peerId) {
      if (remotePeers[peerId]) {
        scene.remove(remotePeers[peerId].mesh);
        if (remotePeers[peerId].conn) remotePeers[peerId].conn.close();
        delete remotePeers[peerId];
      }
    }

    // ==========================================
    // 5. REGULACIÓN DE EMISIÓN DE RED (20 Hz)
    // ==========================================
    setInterval(() => {
      if (!peer || peer.disconnected) return;

      const payload = {
        type: 'transform',
        x: Number(localAvatar.position.x.toFixed(3)),
        y: Number(localAvatar.position.y.toFixed(3)),
        z: Number(localAvatar.position.z.toFixed(3)),
        ry: Number(localAvatar.rotation.y.toFixed(3))
      };

      for (const id in remotePeers) {
        const p = remotePeers[id];
        if (p.conn && p.conn.open) {
          p.conn.send(payload);
        }
      }
    }, 50); // 50 ms = 20 Hz

    // ==========================================
    // 6. BUCLE DE RENDER E INTERPOLACIÓN (LERP)
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      handleLocalMovement();

      // Suavizado visual de avatares remotos
      for (const id in remotePeers) {
        const p = remotePeers[id];
        // LERP de posición: factor 0.15 a 60 fps
        p.mesh.position.lerp(p.targetPos, 0.15);

        // Interpolación angular más corta
        let diff = p.targetRotY - p.mesh.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        p.mesh.rotation.y += diff * 0.15;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
