<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auditorio Virtual UTN - P2P</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #c8d8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #canvas3d {
      position: fixed;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      display: block;
    }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(255, 255, 255, 0.95); color: #1a2530;
      padding: 14px 18px; border-radius: 8px; border: 1px solid #99b4d1;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12); max-width: 90vw;
    }
    input, button {
      background: #eef4fa; color: #1a2530; border: 1px solid #7799bb;
      padding: 7px 12px; margin-top: 6px; border-radius: 4px; font-size: 13px;
    }
    input:focus { outline: 2px solid #0066cc; }
    button { cursor: pointer; background: #0066cc; color: #fff; font-weight: bold; border: none; }
    button:hover { background: #004c99; }
    #stats { font-size: 11px; color: #445566; margin-top: 8px; line-height: 1.4; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div id="hud">
    <div style="font-weight: bold; font-size: 15px; color: #004c99;">Auditorio Virtual UTN</div>
    <div id="connectionPanel">
      <input type="text" id="username" placeholder="Nombre completo" value="Docente"><br>
      <input type="text" id="roomId" placeholder="ID Sala" value="auditorio-1"><br>
      <button id="btnJoin">Ingresar al Auditorio</button>
    </div>
    <div id="stats">PC: Clic para mouse | W, A, S, D: caminar | Esc: liberar<br>Móvil: Mitad izq. desplaza | Mitad der. gira vista</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // ==========================================
      // 1. CONFIGURACIÓN FIREBASE
      // ==========================================
      const firebaseConfig = {
        apiKey: "AIzaSyBgYPJWcmfimhT0FSLp92A4ocFDNOrhTY0",
        authDomain: "reavi-94216.firebaseapp.com",
        databaseURL: "https://reavi-94216-default-rtdb.firebaseio.com",
        projectId: "reavi-94216",
        storageBucket: "reavi-94216.firebasestorage.app",
        messagingSenderId: "369904212083",
        appId: "1:369904212083:web:8dae7ac8a5c6041ee9b206",
        measurementId: "G-Q48KH7JHL8"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ==========================================
      // 2. MOTOR THREE.JS SOBRE EL CANVAS EXPLÍCITO
      // ==========================================
      const canvas = document.getElementById('canvas3d');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd2e0ee);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 500);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Iluminación general difusa
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a080, 0.85));
      const sun = new THREE.DirectionalLight(0xfffaea, 0.7);
      sun.position.set(-15, 25, 12);
      scene.add(sun);

      // ==========================================
      // 3. PANTALLA PROCEDURAL
      // ==========================================
      function getScreenTexture() {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#082a4d';
        ctx.fillRect(0, 0, 1024, 512);

        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(50, 50, 10, 80);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px monospace';
        ctx.fillText('UNIVERSIDAD TECNOLÓGICA NACIONAL', 80, 95);
        ctx.font = '22px monospace';
        ctx.fillStyle = '#9dc0e8';
        ctx.fillText('Facultad Regional Mendoza - Sala de Conferencias', 80, 130);

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(80, 175, 864, 275);

        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('>> ESTADO DEL RECINTO VIRTUAL P2P', 110, 225);
        ctx.fillStyle = '#ffffff';
        ctx.font = '20px monospace';
        ctx.fillText('* Conexión: Peer-to-Peer Activa', 110, 275);
        ctx.fillText('* Sincronización WebRTC Mesh', 110, 325);
        ctx.fillText('* Capacidad: Multiusuario Educativo', 110, 375);

        return new THREE.CanvasTexture(c);
      }

      // ==========================================
      // 4. ESTRUCTURA DEL AUDITORIO CLARO
      // ==========================================
      const matFloor = new THREE.MeshLambertMaterial({ color: 0xd8c4aa });
      const matWall = new THREE.MeshLambertMaterial({ color: 0xeef2f7 });
      const matFront = new THREE.MeshLambertMaterial({ color: 0x1f2e3d });
      const matStage = new THREE.MeshLambertMaterial({ color: 0x824c28 });
      const matDesk = new THREE.MeshLambertMaterial({ color: 0xffffff });
      const matMetal = new THREE.MeshLambertMaterial({ color: 0x667788 });

      // Suelo
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(42, 64), matFloor);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Pared frontal y pantalla
      const frontWall = new THREE.Mesh(new THREE.BoxGeometry(42, 14, 1), matFront);
      frontWall.position.set(0, 7, -31);
      scene.add(frontWall);

      const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), new THREE.MeshBasicMaterial({ map: getScreenTexture() }));
      screen.position.set(0, 7.5, -30.4);
      scene.add(screen);

      // Pizarras laterales blancas
      const matWhiteboard = new THREE.MeshLambertMaterial({ color: 0xffffff });
      [-13.5, 13.5].forEach(x => {
        const wb = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 4.5), matWhiteboard);
        wb.position.set(x, 6, -30.4);
        scene.add(wb);
      });

      // Paredes traseras y laterales
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(42, 14, 1), matWall);
      backWall.position.set(0, 7, 31);
      scene.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 14, 64), matWall);
      leftWall.position.set(-21, 7, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 14, 64), matWall);
      rightWall.position.set(21, 7, 0);
      scene.add(rightWall);

      // Estrado elevado
      const stage = new THREE.Mesh(new THREE.BoxGeometry(26, 0.7, 11), matStage);
      stage.position.set(0, 0.35, -23);
      scene.add(stage);

      const podium = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.25, 1.1), matDesk);
      podium.position.set(-4, 1.3, -20);
      scene.add(podium);

      // Gradas y pupitres
      for (let r = 0; r < 5; r++) {
        const zPos = -7 + (r * 5.5);
        const yStep = r * 0.45;

        const step = new THREE.Mesh(new THREE.BoxGeometry(34, 0.45 + yStep, 5), matWall);
        step.position.set(0, (0.45 + yStep) / 2, zPos);
        scene.add(step);

        [-9, 9].forEach(xOffset => {
          const desk = new THREE.Mesh(new THREE.BoxGeometry(11, 0.08, 0.9), matDesk);
          desk.position.set(xOffset, 0.9 + yStep, zPos);
          scene.add(desk);

          [-4.5, 4.5].forEach(legX => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.9 + yStep), matMetal);
            leg.position.set(xOffset + legX, (0.9 + yStep) / 2, zPos);
            scene.add(leg);
          });
        });
      }

      // ==========================================
      // 5. AVATARES
      // ==========================================
      function createAvatar(accentHex) {
        const root = new THREE.Group();
        const suitMat = new THREE.MeshLambertMaterial({ color: 0x334455 });
        const accentMat = new THREE.MeshLambertMaterial({ color: accentHex });
        const skinMat = new THREE.MeshLambertMaterial({ color: 0xedd0be });
        const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.32), accentMat);
        torso.position.y = 1.25;
        root.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.34, 0.32), skinMat);
        head.position.y = 1.8;
        root.add(head);

        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 0.06), visorMat);
        visor.position.set(0, 1.82, -0.17);
        root.add(visor);

        const limbGeo = new THREE.BoxGeometry(0.16, 0.7, 0.16);

        const leftArm = new THREE.Mesh(limbGeo, suitMat);
        leftArm.position.set(-0.4, 1.25, 0);
        root.add(leftArm);

        const rightArm = new THREE.Mesh(limbGeo, suitMat);
        rightArm.position.set(0.4, 1.25, 0);
        root.add(rightArm);

        const leftLeg = new THREE.Mesh(limbGeo, suitMat);
        leftLeg.position.set(-0.16, 0.45, 0);
        root.add(leftLeg);

        const rightLeg = new THREE.Mesh(limbGeo, suitMat);
        rightLeg.position.set(0.16, 0.45, 0);
        root.add(rightLeg);

        return { root, leftArm, rightArm, leftLeg, rightLeg };
      }

      const localAvatar = createAvatar(0x0077ff);
      localAvatar.root.position.set(0, 0, 7);
      scene.add(localAvatar.root);

      const remotePeers = {};

      // ==========================================
      // 6. CONTROLES (PC MOUSE + TECLADO + MÓVIL)
      // ==========================================
      const keys = {};
      window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

      let localAngle = 0;
      let pitchAngle = 0;
      let walkCycle = 0;
      const mouseSensitivity = 0.0025;

      function isTouchDevice() {
        return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      }

      canvas.addEventListener('click', () => {
        if (!isTouchDevice()) canvas.requestPointerLock();
      });

      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === canvas) {
          localAngle -= e.movementX * mouseSensitivity;
          pitchAngle += e.movementY * mouseSensitivity;
          pitchAngle = Math.max(-0.35, Math.min(0.55, pitchAngle));
        }
      });

      let touchStartX = 0, touchStartY = 0;
      let touchMoveX = 0, touchMoveY = 0;
      let leftTouchId = null, rightTouchId = null;
      let lastTouchCamX = 0, lastTouchCamY = 0;

      window.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.clientX < window.innerWidth / 2 && leftTouchId === null) {
            leftTouchId = t.identifier;
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchMoveX = 0;
            touchMoveY = 0;
          } else if (t.clientX >= window.innerWidth / 2 && rightTouchId === null) {
            rightTouchId = t.identifier;
            lastTouchCamX = t.clientX;
            lastTouchCamY = t.clientY;
          }
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (e.target !== canvas) return;
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === leftTouchId) {
            touchMoveX = (t.clientX - touchStartX) * 0.003;
            touchMoveY = (t.clientY - touchStartY) * 0.003;
            touchMoveX = Math.max(-0.15, Math.min(0.15, touchMoveX));
            touchMoveY = Math.max(-0.15, Math.min(0.15, touchMoveY));
          } else if (t.identifier === rightTouchId) {
            const deltaX = t.clientX - lastTouchCamX;
            const deltaY = t.clientY - lastTouchCamY;
            localAngle -= deltaX * 0.005;
            pitchAngle += deltaY * 0.005;
            pitchAngle = Math.max(-0.35, Math.min(0.55, pitchAngle));
            lastTouchCamX = t.clientX;
            lastTouchCamY = t.clientY;
          }
        }
      }, { passive: false });

      function resetTouch(id) {
        if (id === leftTouchId) { leftTouchId = null; touchMoveX = 0; touchMoveY = 0; }
        if (id === rightTouchId) { rightTouchId = null; }
      }
      window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i].identifier); });
      window.addEventListener('touchcancel', (e) => { for (let i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i].identifier); });

      function handleLocalInput() {
        let moved = false;

        if (keys['q']) localAngle += 0.04;
        if (keys['e']) localAngle -= 0.04;
        localAvatar.root.rotation.y = localAngle;

        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
        const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

        const fwdDelta = (keys['w'] ? 0.15 : 0) - (keys['s'] ? 0.15 : 0) - touchMoveY;
        const strDelta = (keys['d'] ? 0.15 : 0) - (keys['a'] ? 0.15 : 0) + touchMoveX;

        if (Math.abs(fwdDelta) > 0.01 || Math.abs(strDelta) > 0.01) {
          localAvatar.root.position.addScaledVector(fwd, fwdDelta);
          localAvatar.root.position.addScaledVector(rgt, strDelta);
          moved = true;
        }

        localAvatar.root.position.x = Math.max(-19, Math.min(19, localAvatar.root.position.x));
        localAvatar.root.position.z = Math.max(-28, Math.min(27, localAvatar.root.position.z));

        if (moved) {
          walkCycle += 0.22;
          localAvatar.leftLeg.rotation.x = Math.sin(walkCycle) * 0.55;
          localAvatar.rightLeg.rotation.x = -Math.sin(walkCycle) * 0.55;
          localAvatar.leftArm.rotation.x = -Math.sin(walkCycle) * 0.55;
          localAvatar.rightArm.rotation.x = Math.sin(walkCycle) * 0.55;
        } else {
          localAvatar.leftLeg.rotation.x = 0;
          localAvatar.rightLeg.rotation.x = 0;
          localAvatar.leftArm.rotation.x = 0;
          localAvatar.rightArm.rotation.x = 0;
        }

        const camDist = 4.8;
        const camHeight = 2.4 + (pitchAngle * 2.2);
        const camOffset = new THREE.Vector3(0, camHeight, camDist * Math.cos(pitchAngle)).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

        camera.position.copy(localAvatar.root.position).add(camOffset);
        camera.lookAt(localAvatar.root.position.x, localAvatar.root.position.y + 1.35 - (pitchAngle * 1.2), localAvatar.root.position.z);

        return moved;
      }

      // ==========================================
      // 7. SEÑALIZACIÓN FIREBASE Y P2P MESH
      // ==========================================
      let peer = null;
      let myId = null;

      document.getElementById('btnJoin').addEventListener('click', () => {
        const roomName = document.getElementById('roomId').value.trim();
        const userName = document.getElementById('username').value.trim();
        if (!roomName || !userName) return;

        document.getElementById('connectionPanel').style.display = 'none';
        document.getElementById('stats').innerText = "Conectando al auditorio...";

        peer = new Peer();

        peer.on('open', (id) => {
          myId = id;
          document.getElementById('stats').innerText = `Auditorio: ${roomName} | Participante: ${userName}`;

          peer.on('connection', (conn) => setupConnection(conn));

          const roomPeersRef = db.ref(`rooms/${roomName}/peers`);
          const myRef = db.ref(`rooms/${roomName}/peers/${myId}`);

          roomPeersRef.on('child_added', (snap) => {
            const remoteId = snap.key;
            if (remoteId !== myId && !remotePeers[remoteId]) {
              if (myId < remoteId) {
                const conn = peer.connect(remoteId);
                setupConnection(conn);
              }
            }
          });

          myRef.set({ user: userName, t: Date.now() });
          myRef.onDisconnect().remove();

          roomPeersRef.on('child_removed', (snap) => removeRemotePeer(snap.key));
        });

        peer.on('error', (err) => console.error("PeerJS error:", err));
      });

      function setupConnection(conn) {
        conn.on('open', () => {
          if (!remotePeers[conn.peer]) {
            const avatar = createAvatar(0xe65c00);
            scene.add(avatar.root);

            remotePeers[conn.peer] = {
              conn: conn,
              avatar: avatar,
              targetPos: new THREE.Vector3(0, 0, 7),
              targetRotY: 0,
              walkCycle: 0,
              isMoving: false
            };
          } else {
            remotePeers[conn.peer].conn = conn;
          }
        });

        conn.on('data', (data) => {
          if (data.t === 's' && remotePeers[conn.peer]) {
            const p = remotePeers[conn.peer];
            p.targetPos.set(data.x, data.y, data.z);
            p.targetRotY = data.ry;
            p.isMoving = data.m;
          }
        });

        conn.on('close', () => removeRemotePeer(conn.peer));
        conn.on('error', () => removeRemotePeer(conn.peer));
      }

      function removeRemotePeer(id) {
        if (remotePeers[id]) {
          scene.remove(remotePeers[id].avatar.root);
          if (remotePeers[id].conn) remotePeers[id].conn.close();
          delete remotePeers[id];
        }
      }

      setInterval(() => {
        if (!peer || !myId) return;

        const isKeyMoving = keys['w'] || keys['s'] || keys['a'] || keys['d'];
        const isTouchMoving = Math.abs(touchMoveX) > 0.01 || Math.abs(touchMoveY) > 0.01;
        const moving = isKeyMoving || isTouchMoving;

        const payload = {
          t: 's',
          x: Number(localAvatar.root.position.x.toFixed(2)),
          y: Number(localAvatar.root.position.y.toFixed(2)),
          z: Number(localAvatar.root.position.z.toFixed(2)),
          ry: Number(localAvatar.root.rotation.y.toFixed(2)),
          m: moving
        };

        for (const id in remotePeers) {
          const p = remotePeers[id];
          if (p.conn && p.conn.open) p.conn.send(payload);
        }
      }, 50);

      // ==========================================
      // 8. BUCLE DE RENDER
      // ==========================================
      function animate() {
        requestAnimationFrame(animate);

        handleLocalInput();

        for (const id in remotePeers) {
          const p = remotePeers[id];
          p.avatar.root.position.lerp(p.targetPos, 0.15);

          let diff = p.targetRotY - p.avatar.root.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.avatar.root.rotation.y += diff * 0.15;

          if (p.isMoving) {
            p.walkCycle += 0.22;
            p.avatar.leftLeg.rotation.x = Math.sin(p.walkCycle) * 0.55;
            p.avatar.rightLeg.rotation.x = -Math.sin(p.walkCycle) * 0.55;
            p.avatar.leftArm.rotation.x = -Math.sin(p.walkCycle) * 0.55;
            p.avatar.rightArm.rotation.x = Math.sin(p.walkCycle) * 0.55;
          } else {
            p.avatar.leftLeg.rotation.x = 0;
            p.avatar.rightLeg.rotation.x = 0;
            p.avatar.leftArm.rotation.x = 0;
            p.avatar.rightArm.rotation.x = 0;
          }
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
