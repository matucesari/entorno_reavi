<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditorio UTN - Diagnóstico</title>
  <style>
    body { margin: 0; overflow: hidden; background: #e0e8f0; font-family: monospace; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: #ffffff; padding: 10px 14px; border: 1px solid #99aacc;
      border-radius: 4px; color: #112233; font-size: 12px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="info">Diagnóstico 3D: W, A, S, D para caminar | Q, E para rotar</div>

  <script>
    // Inicialización básica
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8e4f0);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Iluminación fija
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Materiales
    const matFloor = new THREE.MeshLambertMaterial({ color: 0xd4ba96 });
    const matWall = new THREE.MeshLambertMaterial({ color: 0xeef2f7 });
    const matStage = new THREE.MeshLambertMaterial({ color: 0x8a4b24 });
    const matScreen = new THREE.MeshBasicMaterial({ color: 0x0a2d54 });
    const matDesk = new THREE.MeshLambertMaterial({ color: 0xffffff });

    // Auditorio
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), matFloor);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wall = new THREE.Mesh(new THREE.BoxGeometry(40, 14, 1), matWall);
    wall.position.set(0, 7, -30);
    scene.add(wall);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), matScreen);
    screen.position.set(0, 7.5, -29.4);
    scene.add(screen);

    const stage = new THREE.Mesh(new THREE.BoxGeometry(24, 0.8, 10), matStage);
    stage.position.set(0, 0.4, -22);
    scene.add(stage);

    for (let r = 0; r < 5; r++) {
      const zPos = -8 + (r * 5);
      const step = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4 + (r * 0.4), 4.5), matWall);
      step.position.set(0, (0.4 + (r * 0.4)) / 2, zPos);
      scene.add(step);

      [-8, 8].forEach(x => {
        const desk = new THREE.Mesh(new THREE.BoxGeometry(10, 0.8, 1), matDesk);
        desk.position.set(x, 0.8 + (r * 0.4), zPos);
        scene.add(desk);
      });
    }

    // Avatar
    const avatar = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.35), new THREE.MeshLambertMaterial({ color: 0x0066cc }));
    torso.position.y = 1.2;
    avatar.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshLambertMaterial({ color: 0xedd0be }));
    head.position.y = 1.8;
    avatar.add(head);

    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.05), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
    visor.position.set(0, 1.82, -0.18);
    avatar.add(visor);

    avatar.position.set(0, 0, 5);
    scene.add(avatar);

    // Controles
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    let angle = 0;
    function animate() {
      requestAnimationFrame(animate);

      if (keys['q']) angle += 0.04;
      if (keys['e']) angle -= 0.04;
      avatar.rotation.y = angle;

      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
      const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);

      if (keys['w']) avatar.position.addScaledVector(fwd, 0.15);
      if (keys['s']) avatar.position.addScaledVector(fwd, -0.15);
      if (keys['a']) avatar.position.addScaledVector(rgt, -0.15);
      if (keys['d']) avatar.position.addScaledVector(rgt, 0.15);

      const offset = new THREE.Vector3(0, 2.5, 5).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
      camera.position.copy(avatar.position).add(offset);
      camera.lookAt(avatar.position.x, avatar.position.y + 1.2, avatar.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
