<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auditorio UTN - P2P</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a222d;
      font-family: monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas3d {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: block; z-index: 1;
    }
    #loginModal {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10, 15, 22, 0.88);
      z-index: 1000;
    }
    .modal-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      width: 90%; max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      color: #112233;
    }
    .modal-box h2 {
      font-size: 18px; margin-bottom: 8px; color: #0055aa;
    }
    .modal-box p {
      font-size: 12px; margin-bottom: 16px; color: #556677;
    }
    .modal-box label {
      display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px;
    }
    .modal-box input {
      width: 100%; padding: 8px 10px; margin-bottom: 12px;
      border: 1px solid #99aacc; border-radius: 4px; font-family: monospace;
    }
    .modal-box button {
      width: 100%; padding: 10px; background: #0066cc; color: #ffffff;
      border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
    }
    .modal-box button:hover { background: #004c99; }
    #hud {
      display: none;
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 14px; border-radius: 6px; border: 1px solid #99aacc;
      font-size: 12px; color: #112233; pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div id="loginModal">
    <div class="modal-box">
      <h2>Auditorio UTN</h2>
      <p>Entorno Virtual Educativo P2P</p>
      <label>Usuario</label>
      <input type="text" id="username" value="Docente">
      <label>Sala</label>
      <input type="text" id="roomId" value="auditorio-1">
      <button id="btnJoin">Ingresar</button>
    </div>
  </div>

  <div id="hud">
    <div id="hudText">Iniciando...</div>
  </div>

  <script>
    // ==========================================
    // 1. FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBgYPJWcmfimhT0FSLp92A4ocFDNOrhTY0",
      authDomain: "reavi-94216.firebaseapp.com",
      databaseURL: "https://reavi-94216-default-rtdb.firebaseio.com",
      projectId: "reavi-94216",
      storageBucket: "reavi-94216.firebasestorage.app",
      messagingSenderId: "369904212083",
      appId: "1:369904212083:web:8dae7ac8a5c6041ee9b206",
      measurementId: "G-Q48KH7JHL8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 2. MOTOR THREE.JS
    // ==========================================
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a4856);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.HemisphereLight(0xffffff, 0x665544, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // ==========================================
    // 3. AUDITORIO
    // ==========================================
    const matFloor = new THREE.MeshLambertMaterial({ color: 0x8a6242 });
    const matWall = new THREE.MeshLambertMaterial({ color: 0xd0d8e2 });
    const matFrontWall = new THREE.MeshLambertMaterial({ color: 0x1e2833 });
    const matStage = new THREE.MeshLambertMaterial({ color: 0x5a341a });
    const matScreen = new THREE.MeshBasicMaterial({ color: 0x092b4f });
    const matDesk = new THREE.MeshLambertMaterial({ color: 0xe6ecf2 });
    const matMetal = new THREE.MeshLambertMaterial({ color: 0x4f5d6c });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(42, 64), matFloor);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const frontWall = new THREE.Mesh(new THREE.BoxGeometry(42, 14, 1), matFrontWall);
    frontWall.position.set(0, 7, -31);
    scene.add(frontWall);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), matScreen);
    screen.position.set(0, 7.5, -30.4);
    scene.add(screen);

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(42, 14, 1), matWall);
    backWall.position.set(0, 7, 31);
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 14, 64), matWall);
    leftWall.position.set(-21, 7, 0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 14, 64), matWall);
    rightWall.position.set(21, 7, 0);
    scene.add(rightWall);

    const stage = new THREE.Mesh(new THREE.BoxGeometry(26, 0.7, 11), matStage);
    stage.position.set(0, 0.35, -23);
    scene.add(stage);

    for (let r = 0; r < 5; r++) {
      const zPos = -7 + (r * 5.5);
      const yStep = r * 0.45;

      const step = new THREE.Mesh(new THREE.BoxGeometry(34, 0.45 + yStep, 5), matWall);
      step.position.set(0, (0.45 + yStep) / 2, zPos);
      scene.add(step);

      [-9, 9].forEach(x => {
        const desk = new THREE.Mesh(new THREE.BoxGeometry(11, 0.08, 0.9), matDesk);
        desk.position.set(x, 0.9 + yStep, zPos);
        scene.add(desk);

        [-4.5, 4.5].forEach(legX => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.9 + yStep), matMetal);
          leg.position.set(x + legX, (0.9 + yStep) / 2, zPos);
          scene.add(leg);
        });
      });
    }

    // ==========================================
    // 4. AVATARES
    // ==========================================
    function createAvatar(accentHex) {
      const root = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.35), new THREE.MeshLambertMaterial({ color: accentHex }));
      torso.position.y = 1.2;
      root.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshLambertMaterial({ color: 0xedd0be }));
      head.position.y = 1.8;
      root.add(head);

      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.05), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
      visor.position.set(0, 1.82, -0.18);
      root.add(visor);

      return root;
    }

    const localAvatar = createAvatar(0x0066cc);
    localAvatar.position.set(0, 0, 7);
    scene.add(localAvatar);

    const remotePeers = {};

    // ==========================================
    // 5. CONTROLES (MOUSE, TECLADO, TÁCTIL)
    // ==========================================
    let isConnected = false;
    const keys = {};
    window.addEventListener('keydown', (e) => { if (isConnected) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if (isConnected) keys[e.key.toLowerCase()] = false; });

    let localAngle = 0;
    let pitchAngle = 0;

    function isTouch() {
      return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    canvas.addEventListener('click', () => {
      if (isConnected && !isTouch()) {
        canvas.requestPointerLock();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === canvas) {
        localAngle -= e.movementX * 0.003;
        pitchAngle += e.movementY * 0.003;
        pitchAngle = Math.max(-0.4, Math.min(0.5, pitchAngle));
      }
    });

    let touchStartX = 0, touchStartY = 0;
    let touchMoveX = 0, touchMoveY = 0;
    let leftTouchId = null, rightTouchId = null;
    let lastTouchCamX = 0, lastTouchCamY = 0;

    window.addEventListener('touchstart', (e) => {
      if (!isConnected) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.clientX < window.innerWidth / 2 && leftTouchId === null) {
          leftTouchId = t.identifier;
          touchStartX = t.clientX; touchStartY = t.clientY;
          touchMoveX = 0; touchMoveY = 0;
        } else if (t.clientX >= window.innerWidth / 2 && rightTouchId === null) {
          rightTouchId = t.identifier;
          lastTouchCamX = t.clientX; lastTouchCamY = t.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isConnected) return;
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === leftTouchId) {
          touchMoveX = (t.clientX - touchStartX) * 0.004;
          touchMoveY = (t.clientY - touchStartY) * 0.004;
          touchMoveX = Math.max(-0.15, Math.min(0.15, touchMoveX));
          touchMoveY = Math.max(-0.15, Math.min(0.15, touchMoveY));
        } else if (t.identifier === rightTouchId) {
          const dx = t.clientX - lastTouchCamX;
          const dy = t.clientY - lastTouchCamY;
          localAngle -= dx * 0.005;
          pitchAngle += dy * 0.005;
          pitchAngle = Math.max(-0.4, Math.min(0.5, pitchAngle));
          lastTouchCamX = t.clientX; lastTouchCamY = t.clientY;
        }
      }
    }, { passive: false });

    function resetTouch(id) {
      if (id === leftTouchId) { leftTouchId = null; touchMoveX = 0; touchMoveY = 0; }
      if (id === rightTouchId) { rightTouchId = null; }
    }
    window.addEventListener('touchend', (e) => { for (let i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i].identifier); });
    window.addEventListener('touchcancel', (e) => { for (let i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i].identifier); });

    function handleLocalInput() {
      if (keys['q']) localAngle += 0.04;
      if (keys['e']) localAngle -= 0.04;
      localAvatar.rotation.y = localAngle;

      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      const rgt = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);

      const fwdDelta = (keys['w'] ? 0.15 : 0) - (keys['s'] ? 0.15 : 0) - touchMoveY;
      const strDelta = (keys['d'] ? 0.15 : 0) - (keys['a'] ? 0.15 : 0) + touchMoveX;

      if (Math.abs(fwdDelta) > 0.01 || Math.abs(strDelta) > 0.01) {
        localAvatar.position.addScaledVector(fwd, fwdDelta);
        localAvatar.position.addScaledVector(rgt, strDelta);
      }

      localAvatar.position.x = Math.max(-19, Math.min(19, localAvatar.position.x));
      localAvatar.position.z = Math.max(-28, Math.min(27, localAvatar.position.z));

      const camOffset = new THREE.Vector3(0, 2.5 + (pitchAngle * 2.0), 5.0 * Math.cos(pitchAngle)).applyAxisAngle(new THREE.Vector3(0, 1, 0), localAngle);
      camera.position.copy(localAvatar.position).add(camOffset);
      camera.lookAt(localAvatar.position.x, localAvatar.position.y + 1.2 - (pitchAngle * 1.2), localAvatar.position.z);
    }

    // ==========================================
    // 6. RED P2P + FIREBASE
    // ==========================================
    let peer = null;
    let myId = null;

    document.getElementById('btnJoin').addEventListener('click', () => {
      const roomName = document.getElementById('roomId').value.trim();
      const userName = document.getElementById('username').value.trim();
      if (!roomName || !userName) return;

      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      if (!isTouch()) canvas.requestPointerLock();

      isConnected = true;
      document.getElementById('hudText').innerText = `Conectando...`;

      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        document.getElementById('hudText').innerText = `Sala: ${roomName} | Usuario: ${userName}`;

        peer.on('connection', (conn) => setupConnection(conn));

        const roomPeersRef = db.ref(`rooms/${roomName}/peers`);
        const myRef = db.ref(`rooms/${roomName}/peers/${myId}`);

        roomPeersRef.on('child_added', (snap) => {
          const remoteId = snap.key;
          if (remoteId !== myId && !remotePeers[remoteId]) {
            if (myId < remoteId) {
              const conn = peer.connect(remoteId);
              setupConnection(conn);
            }
          }
        });

        myRef.set({ user: userName, t: Date.now() });
        myRef.onDisconnect().remove();

        roomPeersRef.on('child_removed', (snap) => removeRemotePeer(snap.key));
      });

      peer.on('error', (err) => console.error("PeerJS:", err));
    });

    function setupConnection(conn) {
      conn.on('open', () => {
        if (!remotePeers[conn.peer]) {
          const mesh = createAvatar(0xd9531e);
          scene.add(mesh);
          remotePeers[conn.peer] = { conn: conn, mesh: mesh, targetPos: new THREE.Vector3(0, 0, 7), targetRotY: 0 };
        } else {
          remotePeers[conn.peer].conn = conn;
        }
      });

      conn.on('data', (data) => {
        if (data.t === 's' && remotePeers[conn.peer]) {
          remotePeers[conn.peer].targetPos.set(data.x, data.y, data.z);
          remotePeers[conn.peer].targetRotY = data.ry;
        }
      });

      conn.on('close', () => removeRemotePeer(conn.peer));
      conn.on('error', () => removeRemotePeer(conn.peer));
    }

    function removeRemotePeer(id) {
      if (remotePeers[id]) {
        scene.remove(remotePeers[id].mesh);
        if (remotePeers[id].conn) remotePeers[id].conn.close();
        delete remotePeers[id];
      }
    }

    setInterval(() => {
      if (!peer || !myId || !isConnected) return;
      const payload = {
        t: 's',
        x: Number(localAvatar.position.x.toFixed(2)),
        y: Number(localAvatar.position.y.toFixed(2)),
        z: Number(localAvatar.position.z.toFixed(2)),
        ry: Number(localAvatar.rotation.y.toFixed(2))
      };
      for (const id in remotePeers) {
        const p = remotePeers[id];
        if (p.conn && p.conn.open) p.conn.send(payload);
      }
    }, 50);

    // ==========================================
    // 7. RENDER LOOP
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      if (isConnected) {
        handleLocalInput();
        for (const id in remotePeers) {
          const p = remotePeers[id];
          p.mesh.position.lerp(p.targetPos, 0.15);
          let diff = p.targetRotY - p.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.mesh.rotation.y += diff * 0.15;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
